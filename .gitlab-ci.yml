# Tests, plus publishing to this instance's own PyPI package registry.
# Public PyPI releases go out from GitHub (.github/workflows/publish.yml):
# PyPI trusted publishing accepts gitlab.com as an OIDC issuer but not
# self-hosted GitLab instances, so tags are also pushed to the GitHub remote.
stages:
  - test
  - publish

default:
  interruptible: true

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  # setuptools-scm derives the version from the git tag, so the default shallow
  # clone (GIT_DEPTH=20, no tag history) would yield a wrong version.
  GIT_DEPTH: "0"

.uv-job: &uv-job
  cache:
    key:
      files:
        - uv.lock
      prefix: uv-$PYTHON_VERSION
    paths:
      - .uv-cache
  after_script:
    - uv cache prune --ci
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# --- test -------------------------------------------------------------------
# No dind on these runners, so Docker/restic-backed tests are deselected with
# `-m "not docker"` and run locally instead: `uv run pytest -m docker`.

test:
  <<: *uv-job
  stage: test
  image: ghcr.io/astral-sh/uv:python$PYTHON_VERSION-bookworm-slim
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.12", "3.13"]
  script:
    - uv sync --dev
    - uv run pytest -m "not docker" -v

pyright:
  <<: *uv-job
  stage: test
  image: ghcr.io/astral-sh/uv:python$PYTHON_VERSION-bookworm-slim
  variables:
    PYTHON_VERSION: "3.12"
  script:
    # pyright[nodejs] brings Node in as a wheel, so nothing is downloaded at
    # runtime and the slim image needs no extra system libs.
    - uv sync --dev
    - uv run pyright

# --- publish on v* tags -----------------------------------------------------
# Mirrors general/ghidranet: SETUPTOOLS_SCM_PRETEND_VERSION takes the version
# straight from the tag, so the build needs no git binary and the published
# version cannot disagree with the tag.

publish:
  stage: publish
  image: python:3.12
  variables:
    SETUPTOOLS_SCM_PRETEND_VERSION: ${CI_COMMIT_TAG#v}
  before_script:
    - pip install uv
  script:
    - uv build
    - uv publish --publish-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
      --username gitlab-ci-token --password "${CI_JOB_TOKEN}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
