[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dorestic"
dynamic = ["version"]
description = "A label-driven backup system for Docker containers using restic"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Eddie Cornejo" },
]
readme = "README.md"
keywords = ["backup", "docker", "restic", "containers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "docker>=7.0,<8.0",
    "pyyaml>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/cornejo/dorestic"
Repository = "https://github.com/cornejo/dorestic"
Issues = "https://github.com/cornejo/dorestic/issues"
Changelog = "https://github.com/cornejo/dorestic/blob/main/CHANGELOG.md"
Funding = "https://ko-fi.com/rdacted"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.411",
    "pytest>=8.0",
]

[project.scripts]
dorestic = "dorestic.cli:main"

[tool.setuptools_scm]
# Version comes from the git tag: v0.5.1 -> 0.5.1. Untagged commits get a
# .devN version. no-local-version drops the +g<sha> suffix, which PyPI rejects.
local_scheme = "no-local-version"
# Used only when there's no git metadata and no PKG-INFO (e.g. a bare source
# copy); a real build from a checkout or sdist never hits this.
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dorestic = ["config.yml.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: tests that require a running Docker daemon",
    "restic: tests that require restic to be installed",
]
