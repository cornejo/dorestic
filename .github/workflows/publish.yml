name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      # SETUPTOOLS_SCM_PRETEND_VERSION takes the version straight from the tag,
      # so the build cannot publish a version that disagrees with it. Without
      # this, setuptools-scm shells out to `git describe` and any loss of git
      # metadata silently yields pyproject's fallback_version instead — which is
      # unrecoverable on PyPI, where a version number can never be reused.
      - name: Build package
        run: |
          export SETUPTOOLS_SCM_PRETEND_VERSION="${GITHUB_REF_NAME#v}"
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
